// Cookie Quest: level data (3 levels). Helpers expand at load into flat arrays the sim uses.

  'use strict';
  // ---- helpers -------------------------------------------------------------
  function cookieLine(x1, y1, x2, y2, n) {
    var out = [];
    for (var i = 0; i < n; i++) { var t = n === 1 ? 0 : i / (n - 1); out.push({ x: x1 + (x2 - x1) * t, y: y1 + (y2 - y1) * t }); }
    return out;
  }
  function cookieArc(x1, y1, x2, y2, peak, n) {
    var out = [];

      var t = n === 1 ? 0.5 : i / (n - 1);

    }

  }

      try { if (window.AudioSys && window.AudioSys.suspend) window.AudioSys.suspend(); } catch (e) { /* */ }
    });
    window.addEventListener('focus', function () {
      try { if (window.AudioSys && window.AudioSys.resume) window.AudioSys.resume(); } catch (e) { /* */ }
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        CQ.input.releaseAll(); CQ.game.autoPause();
        try { if (window.AudioSys && window.AudioSys.suspend) window.AudioSys.suspend(); } catch (e) { /* */ }
      } else {
        last = 0; acc = 0;
        try { if (window.AudioSys && window.AudioSys.resume) window.AudioSys.resume(); } catch (e) { /* */ }
      }
    });
    CQ.game.init();
    render();
    rafId = requestAnimationFrame(frame);
  }

  // Test hooks (always present, harmless). No teleport/victory hooks.
  window.CQ_DEBUG = {
    getState: function () { return CQ.game.debugState(); },
    touch: function () { return { mode: CQ.input.touchMode, active: touchActive(), buttons: touch.buttons.map(function (b) { return { id: b.id, x: b.x, y: b.y, r: b.r }; }), view: { ox: view.ox, oy: view.oy, scale: view.scale, dpr: view.dpr }, quality: quality.cap }; },
    setManualStep: function (on) { manual = !!on; last = 0; acc = 0; },
    step: function (n, skipRender) { n = Math.max(0, n | 0); CQ.input.pollGamepad(); tick(n); if (!skipRender) render(); return CQ.game.debugState(); },
    sim: {
      cloneState: function () { return CQ.game.world ? CQ.sim.cloneState(CQ.game.world) : null; },
      restoreState: function (s) { if (CQ.game.world && s) CQ.sim.restoreState(CQ.game.world, s); },
      simStep: function (input) { if (CQ.game.world) { CQ.sim.step(CQ.game.world, input || {}); return CQ.game.debugState(); } return null; }
    }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window.CQ);

</script>
</body>
</html>
